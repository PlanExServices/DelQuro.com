# Keep all response headers at server level. A location with add_header would
# replace inherited headers in nginx, including those on errors and redirects.
map "$status:$uri" $site_cache_control {
    default "no-cache, must-revalidate";
    ~*^(200|206|304):.*\.(css|js|json|webmanifest)$ "public, max-age=300, must-revalidate";
    ~*^(200|206|304):.*\.(jpg|jpeg|png|webp|gif|svg|ico|woff|woff2|ttf|eot|mp3|mp4|webm)$ "public, max-age=86400, must-revalidate";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    # Keep nginx's slash redirects relative so a TLS proxy does not send
    # HTTPS visitors to an http:// URL.
    absolute_redirect off;

    # Consolidate the public apex host with the canonical www URLs. Internal
    # health checks and preview/container hosts retain their normal behavior.
    if ($host = delquro.com) {
        return 301 https://www.delquro.com$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Inline styles and scripts remain necessary for the static AI Scripts and
    # Sound Library pages. No eval, third-party frames, or object embeds.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' https://cloudflareinsights.com https://static.cloudflareinsights.com; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $site_cache_control always;

    # Internal error handling preserves a genuine 404 status, even when the
    # missing request has no extension or is several directories deep.
    error_page 404 =404 /404.html;
    location = /404.html {
        internal;
    }

    # Defense in depth: only public site files are copied into the image.
    location ~ (^|/)\. {
        return 404;
    }
    location ~* ^/(scripts|catalog|docs|memory|deploy)(/|$) {
        return 404;
    }
    location ~* ^/(Dockerfile|docker-compose\.yml|nginx\.conf|AGENTS\.md|README\.md|DEPLOYMENT\.md|COOLIFY_FIX\.md|PUSH_WINDOWS\.md|PUSH_TO_GITHUB\.(sh|bat))$ {
        return 404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Existing directory links (e.g. /Sounds) retain nginx's slash redirect.
    # No homepage fallback: this site is a collection of real static pages.
    location / {
        try_files $uri $uri/ =404;
    }
}
