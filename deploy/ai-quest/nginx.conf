# All add_header directives stay at server scope so error responses inherit them.
map "$status:$uri" $quest_cache_control {
    default "no-cache, must-revalidate";
    ~*^(200|206|304):/assets/.*-[A-Za-z0-9_-]+\.(js|css)$ "public, max-age=31536000, immutable";
    ~*^(200|206|304):/art/.*\.webp$ "public, max-age=86400, must-revalidate";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/ai-quest;
    index index.html;
    autoindex off;
    server_tokens off;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; worker-src 'none'" always;
    add_header Cache-Control $quest_cache_control always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location = /maintenance.json {
        try_files $uri =404;
    }
    location ~ ^/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]+\.(js|css)$ {
        try_files $uri =404;
    }
    location ~ ^/art/[A-Za-z0-9_-]+\.webp$ {
        try_files $uri =404;
    }
    # Navigation uses URL fragments. Missing paths/assets must never get index.html.
    location / {
        return 404;
    }
}
