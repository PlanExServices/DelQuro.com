# =============================================================================
#  DelQuro Labs - nginx configuration
# =============================================================================
#  This runs INSIDE the Docker container, behind Coolify's Traefik proxy.
#  Traefik terminates TLS and forwards plain HTTP here on port 80, so there is
#  deliberately no certificate handling and no :443 listener in this file.
#
#  Do not add "listen 443 ssl" here - let Coolify own HTTPS.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;
    charset            utf-8;

    # Emit relative "Location: /foo/" headers instead of absolute ones.
    # Traefik owns the public scheme/host/port; nginx must not invent URLs
    # like "http://www.delquro.com/..." that would then need a second hop.
    absolute_redirect  off;

    # ---------------------------------------------------------------------
    # Compression
    #
    # The ~76 MB of MP3s under /Sounds/ are deliberately excluded: they are
    # already compressed, and gzipping them would also defeat the HTTP Range
    # requests that audio scrubbing/seeking depends on.
    # ---------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # ---------------------------------------------------------------------
    # delquro.com  ->  www.delquro.com
    #
    # Every <link rel="canonical"> in the site points at the www host, and
    # robots.txt + sitemap.xml advertise https://www.delquro.com. Serving the
    # apex without redirecting would create duplicate content.
    #
    # For this block to be reached, add https://delquro.com as a second domain
    # on the Coolify application so Traefik routes (and issues a cert for) the
    # apex too. Without that second domain the request never reaches nginx.
    # ---------------------------------------------------------------------
    server {
        listen 80;
        server_name delquro.com;

        include /etc/nginx/snippets/security-headers.conf;

        return 301 https://www.delquro.com$request_uri;
    }

    # ---------------------------------------------------------------------
    # Main site
    #
    # server_name "_" + default_server means: answer for www.delquro.com, for
    # the raw server IP, and for Coolify's own probes.
    # ---------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        root   /usr/share/nginx/html;
        index  index.html;

        include /etc/nginx/snippets/security-headers.conf;

        # Health probe for Coolify, Traefik and any uptime monitor.
        location = /health {
            access_log   off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # --- Audio (/Sounds/*.mp3) ---------------------------------------
        # Large and effectively immutable, so cache hard. Logging is off to
        # keep the access log readable - one page view here can fire 30 of
        # these requests.
        location ~* \.(?:mp3|m4a|aac|ogg|oga|opus|wav|flac)$ {
            include     /etc/nginx/snippets/security-headers.conf;
            add_header  Cache-Control "public, max-age=2592000" always;
            access_log  off;
        }

        # --- Static assets ------------------------------------------------
        # IMPORTANT: these filenames are NOT content-hashed (style.css, not
        # style.a1b2c3.css), so a long "immutable" TTL would leave visitors
        # stuck on stale CSS/JS after a deploy. One hour plus ETag
        # revalidation is the safe middle ground: unchanged files answer 304
        # (near-free), changed files propagate within an hour.
        location ~* \.(?:css|js|mjs|map|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|eot|webmanifest|json|xml|txt)$ {
            include     /etc/nginx/snippets/security-headers.conf;
            add_header  Cache-Control "public, max-age=3600, must-revalidate" always;
        }

        # --- Bare directory -> trailing slash ------------------------------
        # /Sounds must 301 to /Sounds/. Without it, nginx would serve
        # Sounds/index.html while the address bar still read /Sounds, so the
        # browser would resolve that page's relative links ("Train.mp3")
        # against the site root and every clip would 404.
        #
        # These are exact-match locations (= beats regex and prefix matches),
        # so they cannot interfere with anything below. The index is named
        # with a literal path rather than $uri/index.html, which would expand
        # to "Sounds//index.html" for a trailing-slash request.
        #
        # MAINTENANCE: if you add another directory containing an index.html,
        # add a matching pair of lines for it here.
        location = /Sounds {
            include /etc/nginx/snippets/security-headers.conf;
            return 301 /Sounds/;
        }

        location = /Sounds/ {
            include    /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files /Sounds/index.html =404;
        }

        # --- HTML and everything else -------------------------------------
        location / {
            # Resolution order:
            #   /products.html  -> $uri            exact file
            #   /products       -> $uri.html       clean URL, 200 no redirect
            #   /about/team/    -> $uri/index.html generic directory index
            #   /nope           -> 404 (-> /404.html below)
            try_files $uri $uri.html $uri/index.html =404;

            # Pages are a few KB each and a 304 costs almost nothing, so HTML
            # always revalidates. That is what makes a deploy instantly live.
            add_header Cache-Control "no-cache" always;
        }

        # Pretty 404. No "=" modifier, so the response keeps a real 404 status
        # rather than becoming a 200 - that matters for SEO and for link
        # checkers.
        error_page 404 /404.html;
    }
}
