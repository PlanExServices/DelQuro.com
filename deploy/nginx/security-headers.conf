# =============================================================================
#  Shared response headers for the DelQuro Labs site
# =============================================================================
#  nginx's add_header does NOT inherit into a location that declares its own
#  add_header - the inner block replaces the outer one entirely. So this
#  snippet is included both at server level AND in every location that sets a
#  Cache-Control header. If you add a new location with add_header, include
#  this file in it too or the security headers will silently vanish there.
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# -----------------------------------------------------------------------------
# Content-Security-Policy
#
# Tuned to exactly what this site loads today (verified against every .html,
# .css and .js file in the repo):
#
#   style-src 'unsafe-inline'  - the templates use ~48 inline style="..."
#                                attributes for per-card accent colours.
#                                There are no inline <script> blocks.
#   script-src ...cloudflareinsights.com - the Cloudflare Web Analytics beacon
#                                included at the bottom of every page.
#   connect-src ...            - that beacon POSTs its RUM payload to
#                                cloudflareinsights.com/cdn-cgi/rum.
#   img-src data:              - headroom for inline SVG/data-URI imagery.
#   font-src 'self'            - the site uses system fonts only (no webfont
#                                requests), so no third-party font origin.
#
# If you add a font CDN, an analytics provider, an embedded video or a form
# action, extend the relevant directive here.
#
# To diagnose without risk of breaking the live site, temporarily rename the
# header to Content-Security-Policy-Report-Only and watch the browser console.
# -----------------------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' https://cloudflareinsights.com https://static.cloudflareinsights.com; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
