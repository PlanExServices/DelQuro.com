name: Site checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-quest-nginx:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify the standalone AI Quest snapshot
        run: node scripts/check-ai-quest-host.mjs --static
      - name: Build standalone AI Quest
        run: docker build --file deploy/ai-quest/Dockerfile --tag delquro-aiquest:ci .
      - name: Validate and start AI Quest
        run: |
          docker run --rm delquro-aiquest:ci nginx -t
          docker run --detach --name delquro-aiquest-ci --publish 127.0.0.1:8081:80 delquro-aiquest:ci
      - name: Verify delivered files and HTTP behavior
        run: node scripts/check-ai-quest-host.mjs http://127.0.0.1:8081 .
      - name: Install browser verification tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify AI Quest learning and mobile behavior
        run: AI_QUEST_URL=http://127.0.0.1:8081 npx playwright test tests/ai-quest-host.spec.mjs
      - name: Container logs
        if: always()
        run: docker logs delquro-aiquest-ci || true
      - name: Remove the test container
        if: always()
        run: docker rm --force delquro-aiquest-ci || true
  static-and-nginx:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check committed catalog and local links
        run: |
          node scripts/generate-site.mjs --check
          node scripts/check-catalog.mjs
          node scripts/check-links.mjs
          node scripts/check-seo.mjs
      - name: Build the public site image
        run: docker build --tag delquro-site:ci .
      - name: Validate nginx configuration
        run: docker run --rm delquro-site:ci nginx -t
      - name: Start the site container
        run: docker run --detach --name delquro-ci --publish 127.0.0.1:8080:80 delquro-site:ci
      - name: Check nginx responses and published files
        run: |
          node scripts/check-nginx.mjs http://127.0.0.1:8080
          node scripts/check-links.mjs http://127.0.0.1:8080
          docker exec delquro-ci sh -c 'test ! -e /usr/share/nginx/html/.git && test ! -e /usr/share/nginx/html/catalog && test ! -e /usr/share/nginx/html/scripts && test ! -e /usr/share/nginx/html/README.md && test ! -e /usr/share/nginx/html/deploy'
      - name: Container logs
        if: always()
        run: docker logs delquro-ci || true
      - name: Install browser verification tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify browser behavior against nginx
        run: npm run test:browser
      - name: Save browser verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Remove the test container
        if: always()
        run: docker rm --force delquro-ci || true
